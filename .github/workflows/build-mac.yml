name: Build macOS Installer

# Produces unsigned macOS installers (no Apple Developer ID, so no signing).
# Triggered by:
#   - pushing a tag like v1.0.2  -> builds BOTH Intel (x64) and Apple Silicon
#     (arm64) installers in one job and publishes them to the GitHub Release
#   - manual workflow_dispatch   -> builds and uploads as workflow artifacts only
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GITHUB_TOKEN must be able to create the GitHub Release and upload assets.
# The repo default workflow permission is read-only, so we explicitly request
# write access to contents (electron-builder's documented fix for the
# "Resource not accessible by integration" 403 when publishing).
permissions:
  contents: write

jobs:
  build:
    name: macOS (x64 + arm64)
    # One job builds both architectures so each run produces a single
    # consistent latest-mac.yml auto-update feed (two parallel arch jobs would
    # race to overwrite it with an arch-only copy).
    runs-on: macos-14      # Apple Silicon mac runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build unsigned macOS app (x64 + arm64)
        env:
          # No Apple Developer ID available: never attempt to auto-discover a
          # signing identity. Combined with mac.identity:null this yields an
          # unsigned build (Gatekeeper warns, but the app still runs).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Lets electron-builder push to GitHub Releases (publish config).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --x64 --arm64 --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Upload DMG artifact
        if: always()   # keep the .dmg even if only the publish step failed
        uses: actions/upload-artifact@v4
        with:
          name: KebenaMKC-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
